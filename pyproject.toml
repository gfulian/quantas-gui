[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantas-gui"
dynamic = ["version"]
description = "Modern Dash graphical interface for the Quantas scientific library"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    {name = "Gianfranco Ulian"},
    {name = "Giovanni Valdre'"},
]
keywords = [
    "quantas",
    "dash",
    "plotly",
    "solid-state physics",
    "thermodynamics",
    "elasticity",
    "seismic waves",
    "equation of state",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "dash==4.4.1",
    "dash-ag-grid==35.2.0",
    "Flask>=3.1.3,<3.2",
    "Werkzeug>=3.1.6,<3.2",
    "plotly==6.9.0",
    "numpy>=1.24,<3",
    "platformdirs>=4.3,<5",
]

[project.optional-dependencies]
performance = ["orjson>=3.10,<4"]
quantas = ["quantas>=2.0.0b6,<2.1"]
local-jobs = ["diskcache>=5.6,<6"]
server = [
    "celery>=5.5,<6",
    "redis>=6,<7",
    "gunicorn>=23,<24; platform_system != 'Windows'",
    "waitress>=3,<4; platform_system == 'Windows'",
]
dev = [
    "build>=1.2",
    "mypy==2.3.0",
    "pytest>=8.3",
    "pytest-cov>=6",
    "ruff==0.16.0",
    "twine>=6",
]

[project.urls]
Homepage = "https://github.com/gfulian/quantas-gui"
Repository = "https://github.com/gfulian/quantas-gui"
Issues = "https://github.com/gfulian/quantas-gui/issues"
Documentation = "https://github.com/gfulian/quantas-gui/tree/main/docs"
Changelog = "https://github.com/gfulian/quantas-gui/blob/main/CHANGELOG.md"

[project.scripts]
quantas-gui = "quantas_gui.cli:main"

[tool.setuptools.dynamic]
version = {attr = "quantas_gui._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quantas_gui = [
    "py.typed",
    "assets/*.css",
    "assets/*.ico",
    "assets/*.png",
    "assets/images/*.png",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib", "-ra"]

[tool.ruff]
target-version = "py310"
line-length = 100
preview = false
extend-exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
preview = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
preview = false

[tool.mypy]
python_version = "3.10"
files = ["src/quantas_gui"]
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "dash",
    "dash.*",
    "dash_ag_grid",
    "dash_ag_grid.*",
    "plotly",
    "plotly.*",
]
follow_imports = "skip"

# NumPy 2.5+ stubs use Python 3.12 type-statement syntax. Quantas GUI keeps
# Python 3.10 as its public target, so mypy checks our NumPy usage without
# recursively parsing the installed third-party implementation stubs.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
