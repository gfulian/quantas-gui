name: Quantas GUI CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out Quantas backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gfulian/quantas
          ref: dev/refactor
          path: .ci/quantas
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ui-baseline.txt
            constraints/quality-baseline.txt
            constraints/backend-baseline.txt

      - name: Install package and development tools
        run: >-
          python -m pip install --upgrade pip &&
          python -m pip install
          -c constraints/backend-baseline.txt
          .ci/quantas &&
          python -m pip install
          -c constraints/ui-baseline.txt
          -c constraints/quality-baseline.txt
          -c constraints/backend-baseline.txt
          -e ".[dev]"

      - name: Validate source and tests
        run: python tools/run_checks.py --skip-build

  package:
    name: Build package
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ui-baseline.txt
            constraints/quality-baseline.txt
            constraints/backend-baseline.txt

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build distributions
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quantas-gui-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  gate:
    name: CI gate
    if: always()
    needs: [test, package, dependency-review]
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - name: Confirm all required jobs passed
        env:
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
        run: |
          test "$TEST_RESULT" = "success"
          test "$PACKAGE_RESULT" = "success"
          if [ "$DEPENDENCY_REVIEW_RESULT" != "success" ] && \
             [ "$DEPENDENCY_REVIEW_RESULT" != "skipped" ]; then
            exit 1
          fi
