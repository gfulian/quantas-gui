name: Quantas GUI CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ui-baseline.txt
            constraints/quality-baseline.txt
      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -c constraints/ui-baseline.txt -c constraints/quality-baseline.txt -e ".[dev]"
      - name: Validate source and tests
        run: python tools/run_checks.py --skip-build

  package:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ui-baseline.txt
            constraints/quality-baseline.txt
      - name: Install build tools
        run: python -m pip install --upgrade pip build twine
      - name: Build distributions
        run: python -m build
      - name: Check package metadata
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: quantas-gui-distributions
          path: dist/*
