version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      runtime-support:
        patterns:
          - Flask
          - Werkzeug
          - platformdirs
      development-tools:
        dependency-type: development
    ignore:
      # The UI and quality baselines are upgraded only in dedicated changes
      # after their runtime/property and source-quality audits pass.
      - dependency-name: dash
      - dependency-name: dash-ag-grid
      - dependency-name: plotly
      - dependency-name: mypy
      - dependency-name: ruff

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
